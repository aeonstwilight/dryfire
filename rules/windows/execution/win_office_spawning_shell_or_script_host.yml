title: Office Application Spawning a Shell or Script Host
id: b2a87c57-2fa0-4a0d-970c-f0e5e721676c
status: experimental
description: |
    Detects an Office application (Word, Excel, PowerPoint, Outlook, Access,
    Publisher, OneNote) or the legacy Equation Editor starting cmd.exe,
    PowerShell, or a Windows script host (wscript, cscript, mshta). This is
    the usual first step after a malicious macro, embedded object, DDE field
    or document exploit, and it also catches Office binaries abused for DLL
    side-loading. The parent is matched by file name only, so a copied Office
    binary running from a user folder still matches.
author: aeonstwilight
date: 2026-10-17
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://attack.mitre.org/techniques/T1059/
    - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.001
    - attack.t1059.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\msaccess.exe'
            - '\mspub.exe'
            - '\onenote.exe'
            - '\eqnedt32.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Business macros, add-ins or Access databases that shell out to cmd or PowerShell for automation
    - Document management or reporting tools that run scripts from inside Office
level: high
