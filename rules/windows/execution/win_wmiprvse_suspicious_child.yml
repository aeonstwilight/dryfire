title: WMI Provider Host Spawning a Shell, Proxy Binary or User-Folder Executable
id: 1aeda751-657e-4abe-8879-14df60e40bce
status: experimental
description: |
    Detects WmiPrvSE.exe starting a command shell, PowerShell, a script host,
    a common proxy-execution binary (rundll32, regsvr32, msbuild), account or
    download tools (net, certutil, bitsadmin), or any executable from a user
    folder, temp folder or volume shadow copy. WmiPrvSE is the parent of
    processes created through WMI (Win32_Process.Create, wmic process call
    create, Impacket wmiexec, Empire/Covenant WMI modules) and of
    CommandLineEventConsumer subscriptions.
author: aeonstwilight
date: 2026-10-17
references:
    - https://attack.mitre.org/techniques/T1047/
    - https://learn.microsoft.com/en-us/windows/win32/wmisdk/provider-hosting-and-security
tags:
    - attack.execution
    - attack.t1047
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\wmiprvse.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\msbuild.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\certutil.exe'
            - '\bitsadmin.exe'
    selection_child_path:
        Image|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - 'HarddiskVolumeShadowCopy'
    condition: selection_parent and (selection_child or selection_child_path)
falsepositives:
    - Administrators or management tools creating processes remotely through WMI (Win32_Process.Create, wmic, Invoke-CimMethod)
    - Monitoring or inventory agents that run cmd or PowerShell through WMI
level: high
