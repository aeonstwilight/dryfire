# A correlation rule (see scripts/rule_file.py): the first two documents say
# which events count, the last one how they're counted and is the detection.
title: Windows Logon Failed With a Wrong Password or Unknown User (base for the correlation below)
id: edbdb30a-f639-4f72-96c7-9696ecd8506a
name: win_logon_failed_bad_password_or_user
status: experimental
description: |
    An NTLM or other non-Kerberos logon that failed because the password was
    wrong (SubStatus 0xc000006a) or the user doesn't exist (0xc0000064), from a
    network source. Not a detection on its own; counted by the correlation rule
    in this file.
author: aeonstwilight
date: 2026-10-19
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        SubStatus:
            - '0xc000006a'
            - '0xc0000064'
    filter_no_source:
        # Local logons have no source address
        IpAddress:
            - '-'
            - ''
            - '127.0.0.1'
            - '::1'
    condition: selection and not filter_no_source
level: informational
---
title: Windows Kerberos Pre-Authentication Failed (base for the correlation below)
id: e91b576c-389c-4a54-a1ba-fe3938aeaf7b
name: win_kerberos_preauth_failed
status: experimental
description: |
    A Kerberos TGT request that failed pre-authentication (wrong password,
    Status 0x18), from a network source. Not a detection on its own; counted by
    the correlation rule in this file.
author: aeonstwilight
date: 2026-10-19
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4771
        Status: '0x18'
    filter_no_source:
        IpAddress:
            - '::1'
            - '::ffff:127.0.0.1'
            - '127.0.0.1'
    condition: selection and not filter_no_source
level: informational
---
title: Windows Password Spray From One Source
id: 8b5fb25e-453f-4ce5-8aa2-5f8c9bf7746b
status: experimental
description: |
    Detects one source address (IpAddress) failing to log on as 10 or more
    distinct users (TargetUserName) within 30 minutes, with a wrong password or
    an unknown user name (4625) or a failed Kerberos pre-authentication (4771).
    Kerberos events write the address as ::ffff:<IPv4>, so NTLM and Kerberos
    failures from the same host are counted separately.
author: aeonstwilight
date: 2026-10-19
references:
    - https://attack.mitre.org/techniques/T1110/003/
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
    - https://sigmahq.io/docs/meta/correlations.html
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - win_logon_failed_bad_password_or_user
        - win_kerberos_preauth_failed
    group-by:
        - IpAddress
    timespan: 30m
    condition:
        field: TargetUserName
        gte: 10
falsepositives:
    - A misconfigured application or service trying many accounts (stale credentials in a script or scanner)
    - Vulnerability scanners with credentialed checks configured for many accounts
    - Many users failing behind one NAT, proxy or VPN address (a shared egress IP)
level: medium
