title: LSASS Process Opened With Memory Read Access
id: dcb8f47e-4cf7-48fc-9bef-8c5b346ce80c
status: experimental
description: |
    Detects a process opening a handle to lsass.exe with an access mask that
    includes PROCESS_VM_READ (0x10), which is required to read LSASS memory.
    Covers credential dumping tools (Mimikatz, ProcDump, Dumpert, Task Manager
    "Create dump file") and in-memory tooling such as Invoke-Mimikatz.
    Core Windows processes that legitimately open LSASS are excluded by exact path.
author: aeonstwilight
date: 2026-10-17
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
    - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    product: windows
    category: process_access
detection:
    selection_target:
        TargetImage|endswith: '\lsass.exe'
    selection_access:
        # Every mask below includes PROCESS_VM_READ (0x10).
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1f0fff'
            - '0x1f1fff'
            - '0x1f3fff'
            - '0x1fffff'
    filter_main_system:
        SourceImage:
            - 'C:\Windows\System32\services.exe'
            - 'C:\Windows\System32\wininit.exe'
            - 'C:\Windows\System32\csrss.exe'
    condition: selection_target and selection_access and not filter_main_system
falsepositives:
    - AV, EDR and backup agents that scan or snapshot LSASS (tune per environment)
    - Administrators creating LSASS dumps for troubleshooting (e.g. Task Manager, ProcDump)
    - Monitoring or inventory tools that query process memory
level: high
