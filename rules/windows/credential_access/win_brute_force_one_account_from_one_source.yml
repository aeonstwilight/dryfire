# A correlation rule (see scripts/rule_file.py): the first two documents say
# which events count, the last one how they're counted and is the detection.
title: Windows Logon Failed With a Wrong Password (base for the correlation below)
id: b9568342-2794-4bcd-82c4-ee82e0d239a8
name: win_logon_failed_bad_password
status: experimental
description: |
    A non-Kerberos logon that failed because the password was wrong (4625,
    SubStatus 0xc000006a), from a network source. Not a detection on its own;
    counted by the correlation rule in this file.
author: aeonstwilight
date: 2026-10-19
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        SubStatus: '0xc000006a'
    filter_no_source:
        # Local logons have no source address
        IpAddress:
            - '-'
            - ''
            - '127.0.0.1'
            - '::1'
    condition: selection and not filter_no_source
level: informational
---
title: Windows Kerberos Pre-Authentication Failed for an Account (base for the correlation below)
id: 1d18fe99-75b4-4e25-96da-c2e0d88e7fbd
name: win_kerberos_preauth_failed_for_account
status: experimental
description: |
    A Kerberos TGT request that failed pre-authentication (wrong password,
    4771 Status 0x18), from a network source. Not a detection on its own;
    counted by the correlation rule in this file.
author: aeonstwilight
date: 2026-10-19
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4771
        Status: '0x18'
    filter_no_source:
        IpAddress:
            - '::1'
            - '::ffff:127.0.0.1'
            - '127.0.0.1'
    condition: selection and not filter_no_source
level: informational
---
title: Windows Brute Force Against One Account From One Source
id: d8e46973-3665-4f21-a28e-12d4ad52705f
status: experimental
description: |
    Detects 10 or more wrong-password failures for one account
    (TargetUserName) from one source address (IpAddress) within 30 minutes,
    over NTLM or other logons (4625) or Kerberos pre-authentication (4771).
    Whether the guessing then succeeded is the first triage step (4624 for
    the same account and source): Sigma correlations that chain a count into
    a sequence don't convert to Splunk or ES|QL. Kerberos events write the
    address as ::ffff:<IPv4>, so NTLM and Kerberos failures from the same
    host are counted separately.
author: aeonstwilight
date: 2026-10-19
references:
    - https://attack.mitre.org/techniques/T1110/001/
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
    - https://sigmahq.io/docs/meta/correlations.html
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - win_logon_failed_bad_password
        - win_kerberos_preauth_failed_for_account
    group-by:
        - TargetUserName
        - IpAddress
    timespan: 30m
    condition:
        gte: 10
falsepositives:
    - A service, script or mapped drive retrying with an old password after a password change
    - A user's device (phone, laptop) retrying cached credentials after a password change
    - Many users behind one NAT, proxy or VPN address mistyping the same shared account's password
level: medium
