title: AWS Root Account Access Key Used
id: 7c858b55-2567-4f38-ae41-7d838c00359a
status: experimental
description: |
    Detects an API call made by the account's root user with a long-term root
    access key (accessKeyId starting with AKIA). AWS recommends that root has
    no access keys at all, so any use of one is either a key that should have
    been deleted or someone using stolen root credentials from the CLI, an SDK
    or a tool. API calls from a root console session use temporary keys
    (ASIA) and don't match; console sign-ins are covered by the root console
    login rule.
author: aeonstwilight
date: 2026-10-18
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user_manage_add-key.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_identifiers.html#identifiers-unique-ids
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        userIdentity.type: Root
        eventType: AwsApiCall
        userIdentity.accessKeyId|startswith: 'AKIA'  # long-term key; console sessions use ASIA
    condition: selection
falsepositives:
    - Legacy scripts or tools still using a root access key that should be replaced by an IAM role or user
level: high
