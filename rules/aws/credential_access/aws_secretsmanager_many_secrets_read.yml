# A correlation rule (see scripts/rule_file.py): the first document says which
# events count, the second how they're counted and is the detection itself.
title: AWS Secrets Manager Secret Value Read (base for the correlation below)
id: a13c9928-6b5f-483e-a8a2-952085c018af
name: aws_secretsmanager_secret_value_read
status: experimental
description: |
    A secret's value read through Secrets Manager. Not a detection on its own;
    counted by the correlation rule in this file. BatchGetSecretValue is listed
    too, although CloudTrail also writes one GetSecretValue record per secret
    in a batch, so those secrets are counted from their GetSecretValue records.
    Failed calls are included on purpose.
author: aeonstwilight
date: 2026-10-18
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: secretsmanager.amazonaws.com
        eventName:
            - GetSecretValue
            - BatchGetSecretValue
    condition: selection
level: informational
---
title: AWS Secrets Manager Many Distinct Secrets Read by One Identity
id: 5d4abf7c-6493-4770-aaba-f7f6085b5bf5
status: experimental
description: |
    Detects one identity (userIdentity.arn) reading 10 or more distinct
    secrets (requestParameters.secretId) within 10 minutes. Applications
    usually read the same few secrets again and again; reading many different
    secrets in a short time looks like collecting credentials. Failed reads
    count too.
author: aeonstwilight
date: 2026-10-18
references:
    - https://attack.mitre.org/techniques/T1555/006/
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/monitoring-cloudtrail.html
    - https://sigmahq.io/docs/meta/correlations.html
tags:
    - attack.credential-access
    - attack.t1555.006
correlation:
    type: value_count
    rules:
        - aws_secretsmanager_secret_value_read
    group-by:
        - userIdentity.arn
    timespan: 10m
    condition:
        field: requestParameters.secretId
        gte: 10
falsepositives:
    - Deployment or configuration tools that read every secret an application needs at start-up
    - Secret rotation, backup or migration jobs
    - Administrators auditing secrets
level: medium
