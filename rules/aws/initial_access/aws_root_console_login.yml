title: AWS Root Account Console Login
id: 9a6436aa-eb9e-481d-80e9-dcde10d7e757
status: experimental
description: |
    Detects a sign-in to the AWS Management Console as the account's root
    user, successful or failed. Root has unrestricted access that IAM policies
    can't limit, and AWS advises using it only for the few tasks that require
    it. A failed root sign-in is included on purpose: it means someone has the
    root email address and is trying a password or MFA code.
author: aeonstwilight
date: 2026-10-18
references:
    - https://attack.mitre.org/techniques/T1078/004/
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-tasks.html
tags:
    - attack.initial-access
    - attack.privilege-escalation
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventName: ConsoleLogin
        userIdentity.type: Root
    condition: selection
falsepositives:
    - Account owners doing one of the tasks that require root (billing and account settings, closing the account, restoring IAM access)
    - Break-glass access tests
level: high
