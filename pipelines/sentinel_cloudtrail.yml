# Sentinel: send AWS CloudTrail rules to the AWSCloudTrail table.
#
# The Azure Monitor pipeline knows the AWSCloudTrail table (and checks every
# field against it) but has no mapping for `logsource: product: aws,
# service: cloudtrail` or for CloudTrail's field names. This pipeline runs
# before it, sets the table and renames each CloudTrail field to its column.
#
# Each mapping is one CloudTrail field to the AWSCloudTrail column that holds
# the same value, per the column descriptions in Microsoft's table schema
# (as shipped in pySigma-backend-kusto).
#
# Not mapped by default: requestParameters.*, responseElements.* and
# additionalEventData.*. Sentinel keeps those as JSON text in one column
# (RequestParameters, ...), so a field inside them can only be matched with
# `contains`, or a regex written for both the value and the JSON text, on that
# column. Such a mapping is added per field (listed below with the rule that
# needs it), after checking it gives the same result; make validate proves it.
# Until then a rule using one fails conversion for Sentinel.
#
# Used by scripts/convert.py (the "sentinel" target).

name: dryfire Sentinel AWSCloudTrail table mapping
priority: 5
transformations:
  - id: dryfire_awscloudtrail_table
    type: set_state
    key: query_table
    val: AWSCloudTrail
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail

  - id: dryfire_awscloudtrail_fields
    type: field_name_mapping
    mapping:
      eventName: EventName
      eventSource: EventSource
      eventVersion: EventVersion
      eventType: EventTypeName
      eventCategory: Category
      eventID: AwsEventId
      sharedEventID: SharedEventId
      requestID: AwsRequestId_
      apiVersion: APIVersion
      awsRegion: AWSRegion
      sourceIPAddress: SourceIpAddress
      userAgent: UserAgent
      errorCode: ErrorCode
      errorMessage: ErrorMessage
      readOnly: ReadOnly
      managementEvent: ManagementEvent
      recipientAccountId: RecipientAccountId
      vpcEndpointId: VpcEndpointId
      tlsDetails.tlsVersion: TlsVersion
      tlsDetails.cipherSuite: CipherSuite
      tlsDetails.clientProvidedHostHeader: ClientProvidedHostHeader
      userIdentity.type: UserIdentityType
      userIdentity.principalId: UserIdentityPrincipalid
      userIdentity.arn: UserIdentityArn
      userIdentity.accountId: UserIdentityAccountId
      userIdentity.accessKeyId: UserIdentityAccessKeyId
      userIdentity.userName: UserIdentityUserName
      userIdentity.invokedBy: UserIdentityInvokedBy
      userIdentity.sessionContext.sessionIssuer.type: SessionIssuerType
      userIdentity.sessionContext.sessionIssuer.userName: SessionIssuerUserName
      userIdentity.sessionContext.sessionIssuer.arn: SessionIssuerArn
      userIdentity.sessionContext.sessionIssuer.accountId: SessionIssuerAccountId
      userIdentity.sessionContext.sessionIssuer.principalId: SessionIssuerPrincipalId
      userIdentity.sessionContext.attributes.mfaAuthenticated: SessionMfaAuthenticated
      userIdentity.sessionContext.attributes.creationDate: SessionCreationDate
      # Fields inside requestParameters (JSON text in RequestParameters). Each is
      # mapped for rules that match it with a regex written to work on both the
      # field value and that JSON text, checked by make validate.
      requestParameters.policyArn: RequestParameters        # aws_iam_admin_policy_granted
      requestParameters.policyDocument: RequestParameters   # aws_iam_admin_policy_granted
      requestParameters.ipPermissions.items: RequestParameters  # aws_security_group_ingress_open_to_internet (contains)
      requestParameters.cidrIp: RequestParameters               # aws_security_group_ingress_open_to_internet (contains)
      requestParameters.PublicAccessBlockConfiguration.BlockPublicAcls: RequestParameters  # aws_s3_public_access_block_disabled (re)
      requestParameters.PublicAccessBlockConfiguration.IgnorePublicAcls: RequestParameters  # aws_s3_public_access_block_disabled (re)
      requestParameters.PublicAccessBlockConfiguration.BlockPublicPolicy: RequestParameters  # aws_s3_public_access_block_disabled (re)
      requestParameters.PublicAccessBlockConfiguration.RestrictPublicBuckets: RequestParameters  # aws_s3_public_access_block_disabled (re)
      requestParameters.bucketPolicy.Statement: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.accessControlList.x-amz-grant-read: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.accessControlList.x-amz-grant-write: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.accessControlList.x-amz-grant-read-acp: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.accessControlList.x-amz-grant-write-acp: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.accessControlList.x-amz-grant-full-control: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.AccessControlPolicy.AccessControlList.Grant: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.AccessControlPolicy.AccessControlList.Grant.Grantee.URI: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.x-amz-acl: RequestParameters  # aws_s3_bucket_made_public
      requestParameters.enable: RequestParameters  # aws_guardduty_disabled
      requestParameters.features: RequestParameters  # aws_guardduty_disabled
      requestParameters.dataSources.s3Logs.enable: RequestParameters  # aws_guardduty_disabled
      requestParameters.dataSources.kubernetes.auditLogs.enable: RequestParameters  # aws_guardduty_disabled
      requestParameters.dataSources.malwareProtection.scanEc2InstanceWithFindings.ebsVolumes: RequestParameters  # aws_guardduty_disabled
      requestParameters.action: RequestParameters  # aws_guardduty_findings_suppressed
      requestParameters.ruleAction: RequestParameters  # aws_network_acl_ingress_open_to_internet
      requestParameters.egress: RequestParameters  # aws_network_acl_ingress_open_to_internet
      requestParameters.cidrBlock: RequestParameters  # aws_network_acl_ingress_open_to_internet
      requestParameters.ipv6CidrBlock: RequestParameters  # aws_network_acl_ingress_open_to_internet
      requestParameters.createVolumePermission.add.items: RequestParameters  # aws_ec2_or_rds_snapshot_shared_outside_account (re)
      requestParameters.launchPermission.add.items: RequestParameters        # aws_ec2_or_rds_snapshot_shared_outside_account (re)
      requestParameters.valuesToAdd: RequestParameters                       # aws_ec2_or_rds_snapshot_shared_outside_account (re)
      requestParameters.VersioningConfiguration.Status: RequestParameters    # aws_s3_bucket_versioning_suspended (contains)
      requestParameters.documentName: RequestParameters                      # aws_ssm_send_command_run_script (contains)
      # Fields inside responseElements / additionalEventData (JSON text in their
      # columns), on the same terms as the request fields above.
      responseElements.ConsoleLogin: ResponseElements      # aws_iam_user_console_login_without_mfa (contains; the only key)
      additionalEventData.MFAUsed: AdditionalEventData     # aws_iam_user_console_login_without_mfa (re keyed on MFAUsed)
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail
