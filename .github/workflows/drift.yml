# Dependency drift check (M7 side task).
#
# Once a week (and on demand from the Actions tab), run the normal pipeline
# against the newest releases of our tools instead of the pinned ones:
# every package in requirements.txt, and Zircolite. scripts/drift.sh sets
# them up and writes a pinned / tested / newest table to the job summary.
#
# Report-only: nothing in the repo changes. A red run means a newer release
# changes our results (a lint finding, a conversion, a test or a sweep count);
# pins are moved by hand after review. Engine images (Splunk, Kusto,
# Elasticsearch) are not covered yet.
#
# Actions are pinned to the same commit SHAs as ci.yml.

name: Drift

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Reuse the CI build job's dataset cache (same key), so this run doesn't
      # download the corpus again.
      - name: Cache datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/data/external
          key: datasets-build-${{ hashFiles('tests/datasets.yml', 'tests/sweep_corpus.yml', 'scripts/fetch_datasets.py') }}

      - name: Install newest tool versions
        run: scripts/drift.sh

      # The same stages as the CI build job, with the newest Zircolite.
      # Every stage runs even if an earlier one failed.
      - name: Lint
        id: lint
        run: make lint

      - name: Convert
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' }}
        run: make convert

      - name: Test
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' }}
        run: make test ZIRCOLITE_DIR=tools/zircolite-latest

      - name: Coverage
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' }}
        run: make coverage

      - name: Noise sweep
        if: ${{ !cancelled() && steps.lint.conclusion != 'skipped' }}
        run: make sweep ZIRCOLITE_DIR=tools/zircolite-latest

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          for f in build/drift/versions.md build/conversion_summary.md build/tests/results.md build/sweep/summary.md; do
            if [ -f "$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift
          path: build/
          if-no-files-found: ignore
