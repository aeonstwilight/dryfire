# Publishes the ATT&CK Navigator coverage layer to GitHub Pages on every push to main.
# The page links straight into the public ATT&CK Navigator with the layer loaded.
# One-time setup: Settings > Pages > Source: GitHub Actions (Pages on a private repo needs a
# paid plan; on a public repo it's free).
name: Coverage page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build the coverage layer
        run: make coverage
      - name: Assemble the site
        run: |
          mkdir -p site
          cp docs/pages/index.html site/index.html
          cp build/coverage/layer.json site/layer.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
