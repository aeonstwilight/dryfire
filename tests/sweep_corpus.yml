# Noise-sweep corpus for `make sweep` (tests/run_sweep.py).
#
# Downloaded by: python scripts/fetch_datasets.py --manifest tests/sweep_corpus.yml
# into tests/data/external/ (gitignored), with every file's SHA-256 checked.
#
# `sources` are what the sweep runs Zircolite on, one at a time; `path` is
# relative to tests/data/external/ and can be a folder or a single file.
# `datasets` lists every file to download (same format as tests/datasets.yml).
#
# EVTX-ATTACK-SAMPLES: every .evtx file at commit 4ceed2f (the whole repo,
# 278 files, ~50 MB). OTRF: APT29 evaluation day 1 and day 2 (~57 MB zipped,
# ~2.1 GB of JSON; Zircolite reads the zips directly).

