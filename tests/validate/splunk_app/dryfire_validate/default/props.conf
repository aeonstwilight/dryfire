# Mounted into the Splunk container by scripts/engines.sh (test use only).
#
# Test events are sent as JSON through the HTTP Event Collector with
# sourcetype _json. Splunk cuts events at 10,000 characters by default, which
# breaks the JSON of long events (some Sysmon 1 command lines in the samples
# are longer). TRUNCATE = 0 keeps every event whole.
[_json]
TRUNCATE = 0

# AWS CloudTrail test events (sourcetype as set by the Splunk Add-on for AWS).
# The add-on extracts CloudTrail's JSON at search time; here the fields are
# extracted when indexed, like _json, because search-time JSON extraction
# stops after the first few thousand characters of an event. The field names
# are the same either way (userIdentity.type, items{}.cidrIp).
[aws:cloudtrail]
INDEXED_EXTRACTIONS = json
KV_MODE = none
SHOULD_LINEMERGE = false
TRUNCATE = 0
