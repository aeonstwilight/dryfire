# Mounted into the Splunk container by scripts/engines.sh (test use only).
#
# Test events are sent as JSON through the HTTP Event Collector with
# sourcetype _json. Splunk cuts events at 10,000 characters by default, which
# breaks the JSON of long events (some Sysmon 1 command lines in the samples
# are longer). TRUNCATE = 0 keeps every event whole.
[_json]
TRUNCATE = 0
