# Index for test events loaded by tests/run_validate.py (test use only).
[dryfire]
homePath   = $SPLUNK_DB/dryfire/db
coldPath   = $SPLUNK_DB/dryfire/colddb
thawedPath = $SPLUNK_DB/dryfire/thaweddb
# Events keep their own timestamps (some public samples are from 2019); keep
# them for 50 years so Splunk's default 6-year retention never removes them.
frozenTimePeriodInSecs = 1576800000
