# Robustness baseline: the reviewed results of `make robustness` (tests/run_robustness.py).
# Each value is "caught/changed" for one rule and change (see tests/variants.yml), or "-"
# when the change didn't apply to any of the rule's events.
#
# Reviewed by the owner on 2026-10-21. Every change is caught except binary_renamed: rules
# matching on Image miss a renamed copy, which is accepted and written in each rule's triage
# note (Sentinel's SecurityEvent has no OriginalFileName column; the renamed-binary rule
# covers the shells, script hosts and common LOLBins on the other targets).
#
# `make robustness` fails if any value changes or a process-creation rule has no entry. If a
# change is intended (a rule was tuned, samples or variants changed, a rule was added),
# review build/robustness/ and update this file to match.
#
# 2026-10-22: win_renamed_shell_or_lolbin gained seven tools and seven synthetic positives
# (14 -> 21 events, all still caught).

