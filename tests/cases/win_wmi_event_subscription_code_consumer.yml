rule: rules/windows/persistence/win_wmi_event_subscription_code_consumer.yml
positive:
  # Real: Atomic Red Team WMI persistence, CommandLineEventConsumer -> notepad.exe (created,
  # later deleted; only the creation counts)
  - file: tests/data/external/evtx-attack-samples/PanacheSysmon_vs_AtomicRedTeam01.evtx
    min_hits: 1
  # Real: CommandLineEventConsumer "BotConsumer23" created with wmic (created, later deleted)
  - file: tests/data/external/evtx-attack-samples/sysmon_20_21_1_CommandLineEventConsumer.evtx
    min_hits: 1
  # Real: malware ActiveScriptEventConsumer "ProbeScriptFint" (binding Modified)
  - file: tests/data/external/evtx-attack-samples/wmighost_sysmon_20_21_1.evtx
    min_hits: 1
  # Real (OTRF): Empire local subscription, CommandLineEventConsumer -> powershell -enc
  - file: tests/data/external/otrf/empire_wmi_local_event_subscriptions_elevated_user.zip
    min_hits: 1
  # Real (OTRF): Covenant remote ActiveScriptEventConsumer. Its consumer event (20) has no
  # parsed fields in this dataset, so only the binding can catch it.
  - file: tests/data/external/otrf/covenant_wmi_remote_event_subscription_ActiveScriptEventConsumers.zip
    min_hits: 1
  # Synthetic: full-path ActiveScriptEventConsumer binding created; CommandLine binding modified
  - file: tests/data/samples/win_wmi_event_subscription_code_consumer_synthetic_positive.json
    min_hits: 2
negative:
  # Synthetic: binding deleted, bindings to NTEventLog (SCM Event Log Consumer) and LogFile
  # consumers, and a CommandLine consumer created (event 20) with no binding yet
  - file: tests/data/samples/win_wmi_event_subscription_code_consumer_benign.json
