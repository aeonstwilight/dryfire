rule: rules/windows/credential_access/win_password_spray_from_one_source.yml
# Security-log rule: windows-logsources adds the Channel=Security condition.
# A correlation rule: hits are the source addresses over the threshold, not events
# (see detection_hits in run_tests.py). No public dataset in the corpus has a spray
# above the threshold, so the positives are synthetic (owner decision, 2026-10-19).
pipelines: [windows-logsources]
positive:
  # Synthetic: 12 users from one address over NTLM (wrong password and unknown user), 10 users
  # from another over Kerberos; a third address with 9 users doesn't count
  - file: tests/data/samples/win_password_spray_from_one_source_synthetic_positive.json
    min_hits: 2
negative:
  # Real (EVTX-ATTACK-SAMPLES): a Kerberos spray of 2 users (below the threshold), a local
  # logon failure, and network logons
  - file: tests/data/external/evtx-attack-samples/kerberos_pwd_spray_4771.evtx
  - file: tests/data/external/evtx-attack-samples/CA_4624_4625_LogonType2_LogonProc_chrome.evtx
  - file: tests/data/external/evtx-attack-samples/DE_RDP_Tunneling_4624.evtx
  # Synthetic: brute force on one user, 12 users spread over 2 hours, local failures, locked-out
  # and disabled accounts, Kerberos failures from ::1, and successful logons
  - file: tests/data/samples/win_password_spray_from_one_source_benign.json
