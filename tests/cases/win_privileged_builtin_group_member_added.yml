rule: rules/windows/persistence/win_privileged_builtin_group_member_added.yml
# Security-log rule: windows-logsources adds the Channel=Security condition.
pipelines: [windows-logsources]
positive:
  # Synthetic: one 4732 per listed group SID (one with a localized group name). No public sample
  # in EVTX-ATTACK-SAMPLES or OTRF adds a member to these groups.
  - file: tests/data/samples/win_privileged_builtin_group_member_added_synthetic_positive.json
    min_hits: 8
negative:
  # Real: new APT29 account added to Builtin\Users by default (OTRF APT29 day 2), plus synthetic
  # 4733 removal from Backup Operators and 4732 to Event Log Readers (not in the list)
  - file: tests/data/samples/win_privileged_builtin_group_member_added_benign.json
  # Real: Guest and NETWORK SERVICE added to Administrators; that's the Administrators rule's job
  - file: tests/data/external/evtx-attack-samples/Network_Service_Guest_added_to_admins_4732.evtx
