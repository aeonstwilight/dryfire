rule: rules/aws/credential_access/aws_secretsmanager_many_secrets_read.yml
# AWS CloudTrail: no Zircolite pipeline; samples are JSON Lines (see fetch_datasets.py).
# A correlation rule: hits are the identities over the threshold, not events
# (see detection_hits in run_tests.py).
pipelines: []
positive:
  # Real (Invictus IR, Stratus Red Team retrieve-secrets): one user reads 20 secrets in 4 seconds
  - file: tests/data/external/aws/invictus/218007301253_CloudTrail_us-east-1_20230710T1200Z_iLj9fb7yyUG9X4Bf.jsonl
    min_hits: 1
  # Synthetic: a batch read of 12 secrets (with its per-secret GetSecretValue records) and
  # 10 denied reads by a second identity; a third identity reading 9 doesn't count
  - file: tests/data/samples/aws_secretsmanager_many_secrets_read_synthetic_positive.jsonl
    min_hits: 2
negative:
  # Real (Invictus IR): the same user reading 7 distinct secrets
  - file: tests/data/external/aws/invictus/218007301253_CloudTrail_us-east-1_20230710T1200Z_x9kHmzMa7cx6l9wM.jsonl
  # Synthetic: one secret polled 40 times, 9 secrets read twice each, 12 secrets over
  # 24 minutes, DescribeSecret on 12 secrets, and batch calls with no per-secret records
  - file: tests/data/samples/aws_secretsmanager_many_secrets_read_benign.jsonl
